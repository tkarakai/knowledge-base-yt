name: KB performance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kb-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-playwright
      - name: Storage and API regressions
        run: bun run test:kb
      - name: HTTP scale budgets
        run: bun run test:kb:perf
      - name: Browser scale budgets
        run: bun run test:kb:perf:browser
      - name: Preserve timings and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kb-performance
          path: |
            .kb-local/performance/
            .kb-local/qa/
          include-hidden-files: true
          retention-days: 14
